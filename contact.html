<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4B3528">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Velita">
  <meta property="og:title" content="Contact — Velita">
  <meta property="og:description" content="Say hello to Velita. Contact the independent creative development studio at hello@velita.co.">
  <meta property="og:url" content="https://www.velita.co/contact.html">
  <meta property="og:image" content="https://www.velita.co/assets/images/signature-home.jpg">

  <link rel="preload" href="assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/parisienne-latin-400.woff2" as="font" type="font/woff2" crossorigin>

  <style>
@font-face {
  font-family: Parisienne;
  src: url("assets/fonts/parisienne-latin-400.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: Manrope;
  src: url("assets/fonts/manrope-latin-variable.woff2") format("woff2");
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
}
:root {
  --brown: #4B3528;
  --cream: #E9DFD3;
  --gutter: clamp(24px, 6.3vw, 112px);
  color-scheme: dark;
}
*, ::before, ::after { box-sizing: border-box; }
html { background: var(--brown); scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--brown);
  color: var(--cream);
  font-family: Manrope, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1 { margin: 0; font-weight: 400; letter-spacing: -.06em; }
a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
main:focus { outline: none; }
::selection { background: var(--cream); color: var(--brown); }
.wrap {
  width: calc(100% - var(--gutter) * 2);
  max-width: 1680px;
  margin-inline: auto;
}
.skip-link {
  position: fixed;
  z-index: 20;
  top: 16px;
  left: 16px;
  padding: 10px 16px;
  background: var(--cream);
  color: var(--brown);
  transform: translateY(-170%);
}
.skip-link:focus { transform: none; }
.site-header { position: absolute; inset: 0 0 auto; z-index: 5; }
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 126px;
}
.wordmark {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-family: Parisienne, cursive;
  font-size: clamp(44px, 4.1vw, 60px);
  line-height: 1.2;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: clamp(24px, 3.2vw, 48px);
  font-size: 15px;
}
.site-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 48px;
  transition: opacity 160ms ease;
}
.site-nav a:not([aria-current="page"]) { opacity: .83; }
.site-nav a:hover { opacity: 1; }
.site-nav a[aria-current="page"] {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 7px;
}
.scene {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.scene picture { display: block; width: 100%; height: 100%; }
.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: translate3d(var(--scene-x, 0px), var(--scene-y, 0px), 0) scale(1.02);
  transition: transform 900ms cubic-bezier(.2, .6, .3, 1);
}
.scene-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: rgba(30, 17, 10, .08);
  pointer-events: none;
}
.contact-main {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: var(--brown);
}
.contact-copy { position: relative; z-index: 2; padding-block: 220px 150px; }
.contact-copy h1 { font-size: clamp(58px, 7.8vw, 120px); line-height: 1.06; }
.contact-email {
  display: inline-block;
  max-width: 100%;
  padding-block: 5px;
  font-size: clamp(40px, 7.8vw, 120px);
  line-height: 1.15;
  letter-spacing: -.065em;
}
.contact-email:hover {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: .15em;
}
.contact-instagram {
  display: table;
  margin-top: 30px;
  padding-block: 12px;
  font-size: 20px;
}
.contact-instagram:hover { text-decoration: underline; text-underline-offset: 5px; }

@media (min-width: 1800px) {
  .contact-copy { padding-block: 260px 200px; }
}
@media (max-width: 1000px) {
  .header-inner { min-height: 108px; }
  .wordmark { font-size: 48px; }
  .site-nav { font-size: 14px; gap: 28px; }
  .contact-copy h1 { font-size: 64px; }
  .contact-email { font-size: 64px; }
}
@media (max-width: 700px) {
  :root { --gutter: 26px; }
  .header-inner { min-height: 96px; gap: 16px; }
  .wordmark { font-size: 40px; }
  .site-nav { font-size: 13px; gap: 19px; }
  .contact-main { align-items: flex-start; min-height: max(760px, 100svh); }
  .contact-copy { padding-block: 220px 280px; }
  .contact-copy h1 { font-size: clamp(50px, 12vw, 78px); }
  .contact-email { font-size: clamp(29px, 7.8vw, 51px); letter-spacing: -.055em; }
  .contact-instagram { margin-top: 25px; font-size: 18px; }
  .contact-main .scene img { object-position: 36% center; transform: none; }
  .contact-main .scene-shade { background: rgba(28, 15, 8, .25); }
}
@media (max-width: 370px) {
  :root { --gutter: 20px; }
  .wordmark { font-size: 35px; }
  .site-nav { gap: 14px; font-size: 12px; }
  .contact-email { font-size: 27px; }
  .contact-copy { padding-top: 210px; }
}
@media (prefers-reduced-motion: no-preference) {
  .contact-copy { animation: content-in 650ms cubic-bezier(.2, .65, .3, 1) both; }
  @keyframes content-in {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: none; }
  }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Velita",
    "url": "https://www.velita.co/",
    "logo": "https://www.velita.co/favicon.png",
    "description": "An independent creative development studio exploring, designing and building its own digital products.",
    "email": "hello@velita.co",
    "sameAs": ["https://www.instagram.com/velita_apps/"]
  }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="index.html" aria-label="Velita home">Velita</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">Studio</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" class="contact-main" tabindex="-1" data-scene>
    <div class="scene" aria-hidden="true">
      <picture>
        <source media="(max-width:700px)" srcset="assets/images/signature-contact-mobile.jpg">
        <img src="assets/images/signature-contact.jpg" width="1920" height="1280" alt="" fetchpriority="high">
      </picture>
    </div>
    <div class="scene-shade" aria-hidden="true"></div>

    <div class="wrap contact-copy">
      <h1>Say hello.</h1>
      <a class="contact-email" href="mailto:hello@velita.co">hello@velita.co</a>
      <a class="contact-instagram" href="https://www.instagram.com/velita_apps/" target="_blank" rel="noopener noreferrer" aria-label="Velita on Instagram (opens in a new tab)">Instagram</a>
    </div>
  </main>

  <script>
  (() => {
    "use strict";

    const motion = window.matchMedia("(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)");

    document.querySelectorAll("[data-scene]").forEach((section) => {
      const image = section.querySelector(".scene img");
      if (!image) return;

      let frame = 0;

      const reset = () => {
        cancelAnimationFrame(frame);
        image.style.removeProperty("--scene-x");
        image.style.removeProperty("--scene-y");
      };

      section.addEventListener("pointermove", (event) => {
        if (!motion.matches || event.pointerType !== "mouse") return;

        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const bounds = section.getBoundingClientRect();
          const x = (event.clientX - bounds.left) / bounds.width - .5;
          const y = (event.clientY - bounds.top) / bounds.height - .5;

          image.style.setProperty("--scene-x", (x * 8).toFixed(2) + "px");
          image.style.setProperty("--scene-y", (y * 6).toFixed(2) + "px");
        });
      }, { passive: true });

      section.addEventListener("pointerleave", reset);

      if (motion.addEventListener) motion.addEventListener("change", reset);
      else motion.addListener(reset);
    });
  })();
  </script>
</body>
</html>
