  <style>
@font-face {
  font-family: Parisienne;
  src: url("assets/fonts/parisienne-latin-400.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: Manrope;
  src: url("assets/fonts/manrope-latin-variable.woff2") format("woff2");
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
}
:root {
  --brown: #4B3528;
  --cream: #E9DFD3;
  --gutter: clamp(24px, 6.3vw, 112px);
  color-scheme: dark;
}
*, ::before, ::after { box-sizing: border-box; }
html { background: var(--brown); scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--brown);
  color: var(--cream);
  font-family: Manrope, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p { margin: 0; }
h1, h2 { font-weight: 400; letter-spacing: -.06em; }
a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
main:focus { outline: none; }
::selection { background: var(--cream); color: var(--brown); }
.wrap {
  width: calc(100% - var(--gutter) * 2);
  max-width: 1680px;
  margin-inline: auto;
}
.skip-link {
  position: fixed;
  z-index: 20;
  top: 16px;
  left: 16px;
  padding: 10px 16px;
  background: var(--cream);
  color: var(--brown);
  transform: translateY(-170%);
}
.skip-link:focus { transform: none; }
.site-header { position: absolute; inset: 0 0 auto; z-index: 5; }
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 126px;
}
.wordmark {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-family: Parisienne, cursive;
  font-size: clamp(44px, 4.1vw, 60px);
  line-height: 1.2;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: clamp(24px, 3.2vw, 48px);
  font-size: 15px;
}
.site-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 48px;
  transition: opacity 160ms ease;
}
.site-nav a:not([aria-current="page"]) { opacity: .83; }
.site-nav a:hover { opacity: 1; }
.site-nav a[aria-current="page"] {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 7px;
}
.scene {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.scene picture { display: block; width: 100%; height: 100%; }
.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: translate3d(var(--scene-x, 0px), var(--scene-y, 0px), 0) scale(1.02);
  transition: transform 900ms cubic-bezier(.2, .6, .3, 1);
}
.scene-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: rgba(30, 17, 10, .08);
  pointer-events: none;
}
.hero {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  min-height: clamp(780px, 68.6vw, 1120px);
  overflow: hidden;
  background: var(--brown);
}
.hero-copy { position: relative; z-index: 2; padding-block: 220px 170px; }
.hero h1 {
  font-size: clamp(76px, 8.3vw, 128px);
  line-height: 1.03;
  max-width: 850px;
}
.hero-description {
  max-width: 560px;
  margin-top: 26px;
  font-size: clamp(20px, 2vw, 30px);
  line-height: 1.45;
  letter-spacing: -.035em;
}
.approach {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  min-height: clamp(390px, 31.8vw, 540px);
  overflow: hidden;
  background: var(--cream);
  color: var(--brown);
}
.approach .scene img { object-position: center 57%; }
.approach-copy { position: relative; z-index: 2; padding-block: 86px; }
.approach h2 {
  max-width: 690px;
  font-size: clamp(44px, 4.7vw, 72px);
  line-height: 1.06;
}
.approach p {
  max-width: 670px;
  margin-top: 25px;
  font-size: clamp(17px, 1.6vw, 24px);
  line-height: 1.55;
  letter-spacing: -.035em;
}
.approach ::selection { color: var(--cream); background: var(--brown); }
.site-footer { position: relative; z-index: 2; background: var(--brown); }
.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 112px;
}
.footer-wordmark { font-size: 40px; }
.social-link {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-size: 14px;
}
.social-link:hover { text-decoration: underline; text-underline-offset: 5px; }

@media (min-width: 1800px) {
  .hero-copy { padding-block: 260px 200px; }
}
@media (max-width: 1000px) {
  .header-inner { min-height: 108px; }
  .wordmark { font-size: 48px; }
  .site-nav { font-size: 14px; gap: 28px; }
  .hero { min-height: 800px; }
  .hero h1 { font-size: 80px; }
  .hero-description { max-width: 400px; font-size: 23px; }
  .hero .scene img { object-position: 53% center; }
  .approach { min-height: 410px; }
  .approach h2 { font-size: 52px; }
  .approach p { max-width: 420px; font-size: 19px; }
}
@media (max-width: 700px) {
  :root { --gutter: 26px; }
  .header-inner { min-height: 96px; gap: 16px; }
  .wordmark { font-size: 40px; }
  .site-nav { font-size: 13px; gap: 19px; }
  .hero {
    min-height: 850px;
    min-height: max(830px, 100svh);
    align-items: flex-start;
  }
  .hero .scene img { object-position: center; transform: none; }
  .hero .scene-shade { display: none; }
  .hero-copy { padding-block: 160px 430px; }
  .hero h1 {
    font-size: clamp(53px, 12.2vw, 82px);
    line-height: 1.05;
    letter-spacing: -.055em;
    max-width: 540px;
  }
  .hero-description {
    max-width: 340px;
    margin-top: 22px;
    font-size: 19px;
    line-height: 1.5;
    letter-spacing: -.025em;
  }
  .approach {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 0;
    padding-bottom: 0;
  }
  .approach-copy { order: 1; padding-block: 62px 42px; }
  .approach h2 { max-width: 460px; font-size: clamp(38px, 9.3vw, 60px); }
  .approach p { max-width: 370px; font-size: 17px; margin-top: 23px; }
  .approach .scene { position: relative; inset: auto; order: 2; height: 240px; }
  .approach .scene img { object-position: 75% 68%; transform: scale(1.12); }
  .footer-inner { min-height: 96px; }
  .footer-wordmark { font-size: 34px; }
  .social-link { font-size: 13px; }
}
@media (max-width: 370px) {
  :root { --gutter: 20px; }
  .wordmark { font-size: 35px; }
  .site-nav { gap: 14px; font-size: 12px; }
  .hero-copy { padding-top: 145px; }
  .hero h1 { font-size: 47px; }
  .hero-description { font-size: 17px; max-width: 270px; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero-copy { animation: content-in 650ms cubic-bezier(.2, .65, .3, 1) both; }
  @keyframes content-in {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: none; }
  }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Velita",
    "url": "https://www.velita.co/",
    "logo": "https://www.velita.co/favicon.png",
    "description": "An independent creative development studio exploring, designing and building its own digital products.",
    "email": "hello@velita.co",
    "sameAs": ["https://www.instagram.com/velita_apps/"]
  }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="index.html" aria-label="Velita home">Velita</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">Studio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" data-scene aria-labelledby="home-title">
      <div class="scene" aria-hidden="true">
        <picture>
          <source media="(max-width:700px)" srcset="assets/images/signature-home-mobile.jpg">
          <img src="assets/images/signature-home.jpg" width="1920" height="1280" alt="" fetchpriority="high">
        </picture>
      </div>
      <div class="scene-shade" aria-hidden="true"></div>

      <div class="wrap hero-copy">
        <h1 id="home-title">Ideas,<br>taking shape.</h1>
        <p class="hero-description">An independent studio creating<br> digital products.</p>
      </div>
    </section>

    <section class="approach" aria-labelledby="approach-title">
      <div class="scene" aria-hidden="true">
        <img src="assets/images/signature-approach.jpg" width="1774" height="887" alt="" loading="lazy" decoding="async">
      </div>
      <div class="wrap approach-copy">
        <h2 id="approach-title">From a spark<br>to something real.</h2>
        <p>We explore, design and develop a few ideas with care.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="wordmark footer-wordmark" href="index.html" aria-label="Velita home">Velita</a>
      <a class="social-link" href="https://www.instagram.com/velita_apps/" target="_blank" rel="noopener noreferrer" aria-label="Velita on Instagram (opens in a new tab)">Instagram</a>
    </div>
  </footer>

  <script>
  (() => {
    "use strict";

    const motion = window.matchMedia("(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)");

    document.querySelectorAll("[data-scene]").forEach((section) => {
      const image = section.querySelector(".scene img");
      if (!image) return;

      let frame = 0;

      const reset = () => {
        cancelAnimationFrame(frame);
        image.style.removeProperty("--scene-x");
        image.style.removeProperty("--scene-y");
      };

      section.addEventListener("pointermove", (event) => {
        if (!motion.matches || event.pointerType !== "mouse") return;

        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const bounds = section.getBoundingClientRect();
          const x = (event.clientX - bounds.left) / bounds.width - .5;
          const y = (event.clientY - bounds.top) / bounds.height - .5;

          image.style.setProperty("--scene-x", (x * 8).toFixed(2) + "px");
          image.style.setProperty("--scene-y", (y * 6).toFixed(2) + "px");
        });
      }, { passive: true });

      section.addEventListener("pointerleave", reset);

      if (motion.addEventListener) motion.addEventListener("change", reset);
      else motion.addListener(reset);
    });
  })();
  </script>
</body>
