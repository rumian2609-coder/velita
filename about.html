<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:site_name" content="Velita">
  <meta property="og:title" content="The Studio — Velita">
  <meta property="og:description" content="Velita is a founder-led creative development studio exploring and building its own digital products with curiosity and close attention.">
  <meta property="og:url" content="https://www.velita.co/about.html">
  <meta property="og:image" content="https://www.velita.co/assets/images/signature-home.jpg">
  <meta property="og:image:width" content="1920">

  <link rel="preload" href="assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/parisienne-latin-400.woff2" as="font" type="font/woff2" crossorigin>

  <style>
@font-face {
  font-family: Parisienne;
  src: url("assets/fonts/parisienne-latin-400.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: Manrope;
  src: url("assets/fonts/manrope-latin-variable.woff2") format("woff2");
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
}
:root {
  --brown: #4B3528;
  --cream: #E9DFD3;
  --gutter: clamp(24px, 6.3vw, 112px);
  color-scheme: light;
}
*, ::before, ::after { box-sizing: border-box; }
html { background: var(--cream); scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--cream);
  color: var(--brown);
  font-family: Manrope, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, p { margin: 0; }
h1 { font-weight: 400; letter-spacing: -.06em; }
a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
main:focus { outline: none; }
::selection { color: var(--cream); background: var(--brown); }
.wrap {
  width: calc(100% - var(--gutter) * 2);
  max-width: 1680px;
  margin-inline: auto;
}
.skip-link {
  position: fixed;
  z-index: 20;
  top: 16px;
  left: 16px;
  padding: 10px 16px;
  background: var(--cream);
  color: var(--brown);
  transform: translateY(-170%);
}
.skip-link:focus { transform: none; }
.site-header { position: absolute; inset: 0 0 auto; z-index: 5; }
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 126px;
}
.wordmark {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-family: Parisienne, cursive;
  font-size: clamp(44px, 4.1vw, 60px);
  line-height: 1.2;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: clamp(24px, 3.2vw, 48px);
  font-size: 15px;
}
.site-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 48px;
  transition: opacity 160ms ease;
}
.site-nav a:not([aria-current="page"]) { opacity: .83; }
.site-nav a:hover { opacity: 1; }
.site-nav a[aria-current="page"] {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 7px;
}
.scene {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: translate3d(var(--scene-x, 0px), var(--scene-y, 0px), 0) scale(1.02);
  transition: transform 900ms cubic-bezier(.2, .6, .3, 1);
}
.studio-main {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  flex: 1;
  min-height: max(720px, calc(100svh - 112px));
  overflow: hidden;
}
.studio-copy { position: relative; z-index: 2; padding-block: 215px 110px; }
.studio-copy h1 {
  max-width: 640px;
  font-size: clamp(60px, 6.3vw, 98px);
  line-height: 1.06;
}
.studio-copy p {
  max-width: 445px;
  margin-top: 42px;
  font-size: clamp(20px, 2.1vw, 30px);
  line-height: 1.5;
  letter-spacing: -.035em;
}
.studio-copy p + p {
  max-width: 520px;
  margin-top: 30px;
  text-wrap: pretty;
}
.site-footer { position: relative; z-index: 2; background: transparent; }
.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 112px;
}
.footer-wordmark { font-size: 40px; }
.social-link {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  font-size: 14px;
}
.social-link:hover { text-decoration: underline; text-underline-offset: 5px; }

@media (max-width: 1000px) {
  .site-header { background: var(--cream); }
  .header-inner { min-height: 108px; }
  .wordmark { font-size: 48px; }
  .site-nav { font-size: 14px; gap: 28px; }
  .studio-copy h1 { font-size: 68px; }
  .studio-copy p { max-width: 340px; font-size: 20px; }
  .studio-copy p + p { max-width: 340px; }
  .studio-main .scene img { object-position: 43% center; }
}
@media (max-width: 700px) {
  :root { --gutter: 26px; }
  .header-inner { min-height: 96px; gap: 16px; }
  .wordmark { font-size: 40px; }
  .site-nav { font-size: 13px; gap: 19px; }
  .studio-main {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 0;
  }
  .studio-copy { order: 1; padding-block: 160px 55px; }
  .studio-copy h1 {
    font-size: clamp(48px, 11.7vw, 76px);
    max-width: 480px;
    line-height: 1.07;
  }
  .studio-copy p {
    max-width: 400px;
    margin-top: 30px;
    font-size: 19px;
    line-height: 1.6;
  }
  .studio-copy p + p { max-width: 400px; margin-top: 24px; }
  .studio-main .scene {
    position: relative;
    inset: auto;
    order: 2;
    height: 340px;
  }
  .studio-main .scene img { object-position: 68% center; transform: scale(1.08); }
  .footer-inner { min-height: 96px; }
  .footer-wordmark { font-size: 34px; }
  .social-link { font-size: 13px; }
}
@media (max-width: 370px) {
  :root { --gutter: 20px; }
  .wordmark { font-size: 35px; }
  .site-nav { gap: 14px; font-size: 12px; }
  .studio-copy p { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .studio-copy { animation: content-in 650ms cubic-bezier(.2, .65, .3, 1) both; }
  @keyframes content-in {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: none; }
  }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Velita",
    "url": "https://www.velita.co/",
    "logo": "https://www.velita.co/favicon.png",
    "description": "An independent creative development studio exploring, designing and building its own digital products.",
    "email": "hello@velita.co",
    "sameAs": ["https://www.instagram.com/velita_apps/"]
  }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="index.html" aria-label="Velita home">Velita</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html" aria-current="page">Studio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" class="studio-main" tabindex="-1" data-scene>
    <div class="scene" aria-hidden="true">
      <img src="assets/images/signature-cream.jpg" width="1920" height="1280" alt="" fetchpriority="high">
    </div>

    <div class="wrap studio-copy">
      <h1>Independent<br>by design.</h1>
      <p>Velita is a founder-led studio exploring and building its own digital products.</p>
      <p>Ideas are developed with curiosity, close attention and room to evolve.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="wordmark footer-wordmark" href="index.html" aria-label="Velita home">Velita</a>
      <a class="social-link" href="https://www.instagram.com/velita_apps/" target="_blank" rel="noopener noreferrer" aria-label="Velita on Instagram (opens in a new tab)">Instagram</a>
    </div>
  </footer>

  <script>
  (() => {
    "use strict";

    const motion = window.matchMedia("(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)");

    document.querySelectorAll("[data-scene]").forEach((section) => {
      const image = section.querySelector(".scene img");
      if (!image) return;

      let frame = 0;

      const reset = () => {
        cancelAnimationFrame(frame);
        image.style.removeProperty("--scene-x");
        image.style.removeProperty("--scene-y");
      };

      section.addEventListener("pointermove", (event) => {
        if (!motion.matches || event.pointerType !== "mouse") return;

        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const bounds = section.getBoundingClientRect();
          const x = (event.clientX - bounds.left) / bounds.width - .5;
          const y = (event.clientY - bounds.top) / bounds.height - .5;

          image.style.setProperty("--scene-x", (x * 8).toFixed(2) + "px");
          image.style.setProperty("--scene-y", (y * 6).toFixed(2) + "px");
        });
      }, { passive: true });

      section.addEventListener("pointerleave", reset);

      if (motion.addEventListener) motion.addEventListener("change", reset);
      else motion.addListener(reset);
    });
  })();
  </script>
</body>
</html>
