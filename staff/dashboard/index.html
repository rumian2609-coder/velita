<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4B3528">
  <title>Workspace — Velita</title>
  <link rel="icon" href="../../favicon.png" type="image/png">
  <link rel="preload" href="../../assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/workspace.css">
</head>
<body>
<a class="skip-link" href="#workspaceRoot">Skip to workspace</a>
<div class="auth-loading" id="authLoading" role="status" aria-live="polite">
  <div><span class="brand">Velita</span><p id="authStatus">Opening your workspace…</p><a href="../">Return to staff sign-in</a></div>
</div>
<div class="workspace-shell" data-workspace-shell>
  <aside class="sidebar" aria-label="Workspace navigation">
    <div class="sidebar-top"><a class="brand" href="../../" aria-label="Velita public website">Velita</a><button type="button" class="sign-out mobile-sign-out" id="mobileSignOut">Sign out</button></div>
    <p class="workspace-label">Studio workspace</p>
    <nav class="workspace-nav" data-workspace-nav aria-label="Staff pages">
      <button type="button" class="nav-button" data-view="overview" aria-current="page">Overview</button>
      <button type="button" class="nav-button" data-view="projects">Projects</button>
      <button type="button" class="nav-button" data-view="tasks">Tasks</button>
      <button type="button" class="nav-button" data-view="notes">Notes</button>
      <button type="button" class="nav-button" data-view="settings">Settings</button>
    </nav>
    <div class="sidebar-bottom"><p class="device-label">Saved on this device</p><p class="account-email" id="userEmail"></p><button type="button" class="sign-out" id="signOutButton">Sign out</button></div>
  </aside>
  <main class="workspace-main">
    <div class="workspace-content">
      <div class="topline"><span>Velita / Studio workspace</span><span class="local-save" id="saveStatus" role="status">Waiting for sign-in</span></div>
      <div id="workspaceRoot" tabindex="-1"></div>
      <footer class="workspace-footer"><span>Private workspace · Browser-local storage</span><a href="../../">Return to velita.co</a></footer>
    </div>
  </main>
</div>
<noscript><p style="padding:30px">JavaScript is required to sign in and use this workspace.</p></noscript>
<script type="module">


/* ---------------------------------------
   FIREBASE
---------------------------------------- */


import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getAuth,
    onAuthStateChanged,
    signOut

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyA90LSnCB1a7THq7Ze_BVQElGwvD6R-dhY",

    authDomain:
    "velita-1d360.firebaseapp.com",

    projectId:
    "velita-1d360",

    storageBucket:
    "velita-1d360.firebasestorage.app",

    messagingSenderId:
    "827857841403",

    appId:
    "1:827857841403:web:bef04968f35edd0ad7d45e",

    measurementId:
    "G-XCLFF0P9GV"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/* ---------------------------------------
   AUTH GUARD
---------------------------------------- */


const authLoading =
    document.getElementById("authLoading");


const userEmail =
    document.getElementById("userEmail");


onAuthStateChanged(

    auth,

    (user) => {


        if(user){


            userEmail.textContent =
                user.email;


            authLoading.style.display =
                "none";


        }else{


            window.location.replace(
                "../"
            );


        }


    }

);


/* ---------------------------------------
   SIGN OUT
---------------------------------------- */


const signOutButton =
    document.getElementById("signOutButton");


const mobileSignOut =
    document.getElementById("mobileSignOut");


async function handleSignOut(){


    try{


        await signOut(auth);


        window.location.replace(
            "../"
        );


    }catch(error){


        console.error(
            "Sign out failed:",
            error
        );


    }


}


signOutButton.addEventListener(
    "click",
    handleSignOut
);


mobileSignOut.addEventListener(
    "click",
    handleSignOut
);


</script>

<script type="module" src="../assets/workspace-boot.mjs"></script>
<script>
window.setTimeout(() => {
  const loading = document.getElementById('authLoading');
  if (loading && loading.style.display !== 'none') document.getElementById('authStatus').textContent = 'Still connecting. Check your connection, or return to sign-in and try again.';
}, 12000);
</script>
</body>
</html>
