<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ask search engines not to index the internal login page -->
    <meta name="robots" content="noindex, nofollow">

    <title>Staff Access — Velita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Parisienne&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --brown: #4B3528;
            --brown-dark: #34241C;
            --brown-soft: #654B3A;
            --cream: #E9DFD3;
            --cream-soft: rgba(233, 223, 211, 0.72);
            --cream-faint: rgba(233, 223, 211, 0.10);
            --cream-border: rgba(233, 223, 211, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--brown);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Manrope", sans-serif;
            color: var(--cream);
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(141, 105, 80, 0.24),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 87% 82%,
                    rgba(104, 76, 57, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #4B3528 0%,
                    #3D2A20 100%
                );

            overflow-x: hidden;
        }

        a {
            color: inherit;
        }

        /* -------------------------------
           BACKGROUND DETAILS
        -------------------------------- */

        .background-v {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -52%);

            font-family: "Parisienne", cursive;
            font-size: min(75vw, 900px);
            line-height: 1;

            color: rgba(233, 223, 211, 0.022);

            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .glow {
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;

            background: rgba(204, 174, 146, 0.06);
            filter: blur(80px);

            pointer-events: none;
            z-index: 0;
        }

        .glow-one {
            top: -150px;
            right: -130px;
        }

        .glow-two {
            bottom: -180px;
            left: -100px;
        }

        /* -------------------------------
           PAGE
        -------------------------------- */

        .page {
            position: relative;
            z-index: 1;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
        }

        /* -------------------------------
           HEADER
        -------------------------------- */

        .header {
            width: 100%;
            padding: 34px 48px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: "Parisienne", cursive;
            font-size: 38px;
            font-weight: 400;
            line-height: 1;

            text-decoration: none;
            color: var(--cream);
        }

        .internal-label {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;

            color: rgba(233, 223, 211, 0.56);
        }

        .internal-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(233, 223, 211, 0.55);
        }

        /* -------------------------------
           MAIN
        -------------------------------- */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 24px 80px;
        }

        .login-wrap {
            width: 100%;
            max-width: 440px;
        }

        .intro {
            margin-bottom: 34px;
        }

        .eyebrow {
            margin-bottom: 16px;

            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;

            color: rgba(233, 223, 211, 0.52);
        }

        h1 {
            font-size: clamp(40px, 5vw, 55px);
            line-height: 1.03;
            letter-spacing: -0.045em;
            font-weight: 400;

            margin-bottom: 17px;
        }

        .intro-text {
            max-width: 390px;

            font-size: 14px;
            line-height: 1.75;
            font-weight: 300;

            color: var(--cream-soft);
        }

        /* -------------------------------
           LOGIN PANEL
        -------------------------------- */

        .login-panel {
            position: relative;

            padding: 34px;

            border: 1px solid var(--cream-border);
            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(233, 223, 211, 0.095),
                    rgba(233, 223, 211, 0.035)
                );

            box-shadow:
                0 24px 70px rgba(19, 12, 8, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 10px;

            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;

            color: rgba(233, 223, 211, 0.76);
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 54px;

            border: 1px solid rgba(233, 223, 211, 0.14);
            border-radius: 14px;
            outline: none;

            padding: 0 16px;

            background: rgba(29, 19, 14, 0.19);
            color: var(--cream);

            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 400;

            transition:
                border-color 180ms ease,
                background 180ms ease,
                box-shadow 180ms ease;
        }

        input::placeholder {
            color: rgba(233, 223, 211, 0.28);
        }

        input:focus {
            border-color: rgba(233, 223, 211, 0.36);
            background: rgba(29, 19, 14, 0.27);

            box-shadow:
                0 0 0 4px rgba(233, 223, 211, 0.04);
        }

        .password-input {
            padding-right: 74px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: rgba(233, 223, 211, 0.55);

            font-family: "Manrope", sans-serif;
            font-size: 11px;
            font-weight: 500;

            cursor: pointer;

            transition: color 150ms ease;
        }

        .show-password:hover {
            color: var(--cream);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            margin: -4px 0 26px;
        }

        .forgot-password {
            border: none;
            background: transparent;

            font-family: "Manrope", sans-serif;
            font-size: 11px;

            color: rgba(233, 223, 211, 0.50);

            cursor: pointer;
            text-decoration: none;

            transition: color 150ms ease;
        }

        .forgot-password:hover {
            color: var(--cream);
        }

        .sign-in-button {
            width: 100%;
            height: 55px;

            border: 1px solid var(--cream);
            border-radius: 14px;

            background: var(--cream);
            color: var(--brown-dark);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;

            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;

            cursor: pointer;

            transition:
                transform 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .sign-in-button:hover {
            transform: translateY(-1px);

            background: #F2E9DE;

            box-shadow:
                0 12px 35px rgba(22, 14, 10, 0.18);
        }

        .sign-in-button:active {
            transform: translateY(0);
        }

        .arrow {
            font-size: 16px;
            line-height: 1;
            transition: transform 160ms ease;
        }

        .sign-in-button:hover .arrow {
            transform: translateX(3px);
        }

        /* -------------------------------
           STATUS MESSAGE
        -------------------------------- */

        .status-message {
            display: none;

            margin-top: 18px;
            padding: 13px 15px;

            border-radius: 12px;
            border: 1px solid rgba(233, 223, 211, 0.11);

            background: rgba(233, 223, 211, 0.045);

            color: rgba(233, 223, 211, 0.68);

            font-size: 11px;
            line-height: 1.6;
        }

        .status-message.visible {
            display: block;
        }

        /* -------------------------------
           SECURITY NOTE
        -------------------------------- */

        .security-note {
            display: flex;
            gap: 10px;
            align-items: flex-start;

            margin-top: 22px;

            color: rgba(233, 223, 211, 0.38);

            font-size: 10px;
            line-height: 1.55;
        }

        .lock {
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* -------------------------------
           BACK LINK
        -------------------------------- */

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 28px;

            font-size: 11px;
            text-decoration: none;

            color: rgba(233, 223, 211, 0.42);

            transition:
                color 150ms ease,
                transform 150ms ease;
        }

        .back-link:hover {
            color: rgba(233, 223, 211, 0.85);
            transform: translateX(-2px);
        }

        /* -------------------------------
           FOOTER
        -------------------------------- */

        footer {
            padding: 0 48px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: rgba(233, 223, 211, 0.26);

            font-size: 9px;
            letter-spacing: 0.04em;
        }

        /* -------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 640px) {

            .header {
                padding: 26px 22px;
            }

            .logo {
                font-size: 33px;
            }

            .internal-label {
                font-size: 8px;
                letter-spacing: 0.18em;
            }

            main {
                align-items: flex-start;
                padding:
                    70px
                    20px
                    60px;
            }

            .login-panel {
                padding: 26px 22px;
                border-radius: 22px;
            }

            .intro {
                margin-bottom: 28px;
            }

            h1 {
                font-size: 43px;
            }

            footer {
                padding: 0 22px 24px;
            }

            .footer-right {
                display: none;
            }

        }

    </style>
</head>

<body>

    <div class="background-v" aria-hidden="true">V</div>
    <div class="glow glow-one" aria-hidden="true"></div>
    <div class="glow glow-two" aria-hidden="true"></div>

    <div class="page">

        <header class="header">

            <a
                href="../index.html"
                class="logo"
                aria-label="Return to Velita"
            >
                Velita
            </a>

            <div class="internal-label">
                <span class="internal-dot"></span>
                Internal
            </div>

        </header>


        <main>

            <div class="login-wrap">

                <section class="intro">

                    <div class="eyebrow">
                        Staff Access
                    </div>

                    <h1>
                        Welcome back.
                    </h1>

                    <p class="intro-text">
                        Sign in with your authorised Velita account
                        to access the internal workspace.
                    </p>

                </section>


                <section class="login-panel">

                    <form id="staffLoginForm">

                        <div class="form-group">

                            <label for="email">
                                Work email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="name@velita.co"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrap">

                                <input
                                    class="password-input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    id="togglePassword"
                                >
                                    Show
                                </button>

                            </div>

                        </div>


                        <div class="form-options">

                            <button
                                type="button"
                                class="forgot-password"
                                id="forgotPassword"
                            >
                                Forgot password?
                            </button>

                        </div>


                        <button
                            class="sign-in-button"
                            type="submit"
                        >
                            Sign in
                            <span class="arrow">→</span>
                        </button>


                        <div
                            class="status-message"
                            id="statusMessage"
                            role="status"
                        >
                        </div>

                    </form>


                    <div class="security-note">

                        <span class="lock">⌾</span>

                        <span>
                            Access is restricted to authorised Velita
                            personnel.
                        </span>

                    </div>

                </section>


                <a
                    href="../index.html"
                    class="back-link"
                >
                    ← Return to velita.co
                </a>

            </div>

        </main>


        <footer>

            <span>
                © Velita
            </span>

            <span class="footer-right">
                Internal access
            </span>

        </footer>

    </div>


    <script>

        /* ---------------------------------------
           SHOW / HIDE PASSWORD
        ---------------------------------------- */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {

            const showing =
                passwordInput.type === "text";

            passwordInput.type =
                showing ? "password" : "text";

            togglePassword.textContent =
                showing ? "Show" : "Hide";

        });


        /* ---------------------------------------
           TEMPORARY LOGIN BEHAVIOUR

           Firebase Authentication will replace
           this section later.

           IMPORTANT:
           There are NO passwords or authorised
           emails stored in this file.
        ---------------------------------------- */

        const loginForm =
            document.getElementById("staffLoginForm");

        const statusMessage =
            document.getElementById("statusMessage");

        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();

            statusMessage.textContent =
                "Staff authentication has not been connected yet.";

            statusMessage.classList.add("visible");

        });


        /* ---------------------------------------
           TEMPORARY PASSWORD RESET BEHAVIOUR
        ---------------------------------------- */

        const forgotPassword =
            document.getElementById("forgotPassword");

        forgotPassword.addEventListener("click", () => {

            statusMessage.textContent =
                "Password recovery will become available when staff authentication is connected.";

            statusMessage.classList.add("visible");

        });

    </script>

</body>
</html>
