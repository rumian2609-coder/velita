<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4B3528">
    <title>Staff Access — Velita</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="preload" href="../assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/parisienne-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./assets/login.css">
</head>
<body>
    <main class="staff-shell">
        <section class="access-side" aria-labelledby="staff-title">
            <p class="access-wordmark">Velita</p>
            <div class="login-wrap">
                <div class="intro">
                    <h1 id="staff-title">Staff Access</h1>
                    <p class="intro-text" id="access-description">For authorised Velita personnel.</p>
                </div>
                <form id="staffLoginForm" aria-labelledby="staff-title" aria-describedby="access-description">
                    <div class="form-group">
                        <label for="email">Work email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@velita.co"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            inputmode="email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input
                                class="password-input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="show-password" id="togglePassword" aria-controls="password">Show</button>
                        </div>
                    </div>
                    <div class="form-options">
                        <button type="button" class="forgot-password" id="forgotPassword">Forgot password?</button>
                    </div>
                    <button class="sign-in-button" type="submit">Sign in</button>
                    <div class="status-message" id="statusMessage" role="status" aria-live="polite" aria-atomic="true"></div>
                </form>
                <a href="../index.html" class="back-link">Return to velita.co</a>
            </div>
            <footer class="access-footer"><small>© Velita</small></footer>
        </section>
        <div class="signature-side" aria-hidden="true">
            <picture>
                <source media="(max-width: 860px)" srcset="./assets/signature-home-mobile.jpg">
                <img src="./assets/signature-home.jpg" alt="" width="1920" height="1280" fetchpriority="high">
            </picture>
        </div>
    </main>

<script type="module">

    /* ---------------------------------------
       FIREBASE IMPORTS
    ---------------------------------------- */

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    /* ---------------------------------------
       FIREBASE CONFIG
    ---------------------------------------- */

    const firebaseConfig = {
        apiKey: "AIzaSyA90LSnCB1a7THq7Ze_BVQElGwvD6R-dhY",
        authDomain: "velita-1d360.firebaseapp.com",
        projectId: "velita-1d360",
        storageBucket: "velita-1d360.firebasestorage.app",
        messagingSenderId: "827857841403",
        appId: "1:827857841403:web:bef04968f35edd0ad7d45e",
        measurementId: "G-XCLFF0P9GV"
    };


    /* ---------------------------------------
       INITIALISE FIREBASE
    ---------------------------------------- */

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    /* ---------------------------------------
       ELEMENTS
    ---------------------------------------- */

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const loginForm =
        document.getElementById("staffLoginForm");

    const statusMessage =
        document.getElementById("statusMessage");

    const forgotPassword =
        document.getElementById("forgotPassword");


    /* ---------------------------------------
       SHOW / HIDE PASSWORD
    ---------------------------------------- */

    togglePassword.addEventListener("click", () => {

        const showing =
            passwordInput.type === "text";

        passwordInput.type =
            showing ? "password" : "text";

        togglePassword.textContent =
            showing ? "Show" : "Hide";

    });


    /* ---------------------------------------
       SIGN IN
    ---------------------------------------- */

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        statusMessage.textContent =
            "Signing in...";

        statusMessage.classList.add("visible");

        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            statusMessage.textContent =
                "Sign in successful. Redirecting...";

            setTimeout(() => {
                window.location.href = "./dashboard/";
            }, 500);

        } catch (error) {

            console.error(error);

            statusMessage.textContent =
                "Unable to sign in. Please check your email and password.";

        }

    });


    /* ---------------------------------------
       PASSWORD RESET
    ---------------------------------------- */

    forgotPassword.addEventListener("click", async () => {

        const email =
            document.getElementById("email").value.trim();

        if (!email) {

            statusMessage.textContent =
                "Enter your work email first, then select Forgot password.";

            statusMessage.classList.add("visible");

            return;
        }

        try {

            await sendPasswordResetEmail(
                auth,
                email
            );

            statusMessage.textContent =
                "Password reset email sent. Check your inbox.";

            statusMessage.classList.add("visible");

        } catch (error) {

            console.error(error);

            statusMessage.textContent =
                "Unable to send a password reset email.";

            statusMessage.classList.add("visible");

        }

    });


    /* ---------------------------------------
       ALREADY SIGNED IN?
    ---------------------------------------- */

    onAuthStateChanged(auth, (user) => {

        if (user) {

            console.log(
                "Authenticated staff user:",
                user.email
            );

        }

    });

</script>

</body>
</html>
